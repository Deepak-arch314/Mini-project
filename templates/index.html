<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Plagiarism Detection Using String Matching</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="site-header">
    <h1>Plagiarism Detection Using String Matching</h1>
    <p>Compare a submitted document with the original and find copied text.</p>
  </header>

  <main class="container">
    <div id="error-box" class="alert" role="alert" hidden></div>

    <section class="inputs">
      <div class="panel">
        <div class="panel-head">
          <label for="original">Original / Reference Text</label>
          <label class="file-btn">Upload .txt
            <input type="file" id="original-file" accept=".txt,text/plain" hidden>
          </label>
        </div>
        <textarea id="original" placeholder="Paste the original content here..."></textarea>
        <small id="original-count">0 words</small>
      </div>

      <div class="panel">
        <div class="panel-head">
          <label for="submitted">Submitted Text</label>
          <label class="file-btn">Upload .txt
            <input type="file" id="submitted-file" accept=".txt,text/plain" hidden>
          </label>
        </div>
        <textarea id="submitted" placeholder="Paste the submitted content here..."></textarea>
        <small id="submitted-count">0 words</small>
      </div>
    </section>

    <section class="controls">
      <div class="option">
        <label for="algorithm">Algorithm</label>
        <select id="algorithm">
{% for a in algorithms %}
  <option value="{{ a }}">{{ a.replace('_', ' ').title() }}</option>
{% endfor %}
        </select>
      </div>
      <div class="option">
        <label for="min-words">Minimum match (words)</label>
        <input type="number" id="min-words" value="4" min="2" max="20">
      </div>
      <div class="buttons">
        <button id="sample-btn" class="btn secondary" type="button">Load Sample</button>
        <button id="clear-btn" class="btn secondary" type="button">Clear</button>
        <button id="check-btn" class="btn primary" type="button">Check Plagiarism</button>
      </div>
    </section>

    <section id="results" hidden>
      <div id="verdict" class="verdict">
        <div>
          <h2 id="verdict-text"></h2>
          <p id="verdict-sub"></p>
        </div>
        <div class="score"><span id="score-value">0%</span><small>Similarity</small></div>
      </div>
      <div class="meter"><div id="meter-fill"></div></div>

      <div class="stats">
        <div><b id="st-orig">0</b><span>Original words</span></div>
        <div><b id="st-sub">0</b><span>Submitted words</span></div>
        <div><b id="st-match">0</b><span>Matched words</span></div>
        <div><b id="st-sections">0</b><span>Matching sections</span></div>
      </div>

      <h3>Matching Sections</h3>
      <div id="matches" class="matches"></div>

      <h3>Highlighted Comparison</h3>
      <div class="inputs">
        <div class="panel"><div class="panel-head"><span class="label">Original</span></div><div id="hl-original" class="highlight-box"></div></div>
        <div class="panel"><div class="panel-head"><span class="label">Submitted</span></div><div id="hl-submitted" class="highlight-box"></div></div>
      </div>
    </section>
  </main>

  <footer class="site-footer"></footer>
  <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
